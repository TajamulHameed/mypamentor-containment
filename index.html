<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>MyPA Mentor — Temporarily unavailable</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 6vw, 4rem);
      background: #ffffff;
      border: 1px solid #dfe6f1;
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgba(23, 32, 51, 0.08);
    }

    .brand {
      margin: 0 0 2rem;
      color: #274c77;
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 18ch;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    p {
      margin: 1.5rem 0 0;
      max-width: 58ch;
      color: #4a5568;
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .support {
      padding-top: 1.5rem;
      border-top: 1px solid #e8edf5;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">MyPA Mentor</p>
    <h1>We’ll be back shortly.</h1>
    <p>Our website is temporarily unavailable while we carry out essential maintenance. Thank you for your patience.</p>
    <p class="support">If you need help with an existing booking or order, please reply to your latest confirmation email so the support team can assist you.</p>
  </main>
</body>
</html>
